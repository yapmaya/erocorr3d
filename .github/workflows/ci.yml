name: CI

# Doğrulama paketi: lint + tip kontrolü (build içinde tsc --noEmit) + testler
# (packages/engine/tests/validation/*.test.ts dahil). Bu iş başarısız
# olursa main dalı koruması (bkz. docs/yayinlama.md) birleştirmeyi/yayını
# engeller.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
